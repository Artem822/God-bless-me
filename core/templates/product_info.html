{% extends "base.html" %}
{% block title %}
Product info
{% endblock %}
{% block content %}

<div class='container'>
<h1>{{product.name}} </h1>
<img src="{{product.image.url}}" alt="None" width="250"> <br>
<h2>Описание</h2>
{{product.description}}<br>
<h2>Цена: {{product.price}} Руб.</h2>
<h2>В наличии: {{product.stock}}</h2>
<form action="{% url 'add' product.id %}" method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-sm btn-primary">Добавить в корзину</button>
</form>
</div>
{% endblock %}
