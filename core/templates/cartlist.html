{% extends "base.html" %}
{% block title %}
Корзина
{% endblock %}
{% block content %}
    {% for product in cart_items.product.all%}
        <div class='form-control container '>
            <h1>{{product.name}} </h1>
            <img src="{{product.image.url}}" alt="None" width="250"> <br>
            <h2>Цена: {{product.price}} Руб.</h2>
            <form action="{% url 'delete' product.id %}" method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-sm btn-primary">Удалить</button>
            </form>
        </div>
    {% endfor %}
{% endblock %}
