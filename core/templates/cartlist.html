{% extends "base.html" %}
{% block title %}
Корзина
{% endblock %}
{% block content %}
    {% for el in cart_items.product.all%}
        <div class='form-control container '>
            <h1>{{el.name}} </h1>
            <img src="{{el.image.url}}" alt="None" width="250"> <br>
            <h2>Цена: {{el.price}} Руб.</h2>
        </div>
    {% endfor %}
{% endblock %}
